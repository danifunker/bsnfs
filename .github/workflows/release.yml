# Release on every push to main: build everything, then publish it as release
# YYYY.MM.DD.HHMMSS (the commit's UTC time), tagged vYYYY.MM.DD.HHMMSS and
# marked as the latest release. The notes list the commits since the previous
# release.
#
# Run it by hand (Actions > Release > Run workflow) to rebuild and republish
# the current main; the version stays the same, so that release is replaced.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order. GitHub keeps only the newest waiting
# run, so a burst of pushes releases the last one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Run every JavaScript action on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(scripts/dist/version.sh timestamp)
          # The newest release other than this one: re-running a release
          # republishes the same version, and must still compare against the
          # one before it.
          PREVIOUS=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 --json tagName \
            --jq "[.[] | select(.tagName != \"v$VERSION\")][0].tagName // empty" 2>/dev/null || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Releasing \`$VERSION\` from \`$(git rev-parse --short HEAD)\` (previous: ${PREVIOUS:-none})" >> "$GITHUB_STEP_SUMMARY"

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      # Once the signing secrets exist, set the repository variable
      # REQUIRE_NOTARIZATION=true so a release can't ship an unnotarized binary.
      require_notarization: ${{ vars.REQUIRE_NOTARIZATION == 'true' }}

  publish:
    name: Publish
    needs: [prepare, test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes
        run: >
          scripts/dist/release-notes.sh --channel release
          --version "${{ needs.prepare.outputs.version }}"
          --tag "${{ needs.prepare.outputs.tag }}"
          --commit "${{ needs.prepare.outputs.sha }}"
          -o "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: >
          scripts/dist/publish-github.sh
          --tag "${{ needs.prepare.outputs.tag }}" --move-tag
          --sha "${{ needs.prepare.outputs.sha }}"
          --title "bsnfs ${{ needs.prepare.outputs.version }}"
          --notes "$RUNNER_TEMP/notes.md" --dir dist
          ${PREVIOUS:+--previous "$PREVIOUS"}
